# Render blueprint — deploys the XVibe studio as one web service.
#
# New → Blueprint in the Render dashboard, point it at this repo, and Render
# creates the service + persistent disk and prompts for the secret env vars.
#
# The persistent disk holds .xvibe state (app workspaces, delivery-token
# custody, transcripts) — Render's filesystem is ephemeral without it.
# XVibe's own operational data moves into a Pluggie project in Phase 2.
services:
  - type: web
    name: xvibe-studio
    runtime: node
    plan: starter # persistent disks require a paid instance
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /unlock
    autoDeploy: true
    disk:
      name: xvibe-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: XVIBE_STATE_DIR
        value: /var/data/xvibe
      - key: PLUGGIE_MCP_URL
        value: https://pluggie.app/api/mcp
      - key: PLUGGIE_DELIVERY_BASE
        value: https://pluggie.app/api/v1
      # Model tiers are routed per request (P0); no model env needed.
      # XVIBE_FORCE_MODEL may be added in the dashboard as a cost-emergency
      # override. (BUILDER_MODEL is retired — safe to delete if present.)
      # Secrets + deployment-specific values — Render prompts for these:
      - key: PLUGGIE_MCP_TOKEN
        sync: false
      - key: PLUGGIE_PROJECT_ID
        sync: false
      - key: PLUGGIE_PROJECT_NAME
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Gate the studio — builds spend the API key. Pick any strong passphrase.
      - key: STUDIO_ACCESS_KEY
        sync: false
      # PUBLISHED apps: <slug>.<this domain>, served by the Cloudflare edge
      # worker from R2. Set to xvibe.app once the proxied *.xvibe.app wildcard
      # is in place (it is, as of 2026-08-01).
      - key: XVIBE_APPS_BASE_DOMAIN
        sync: false
      # LIVE preview: <slug>.<this domain>, served by THIS host from the app's
      # working directory. Keep it on apps.xvibe.app (DNS-only → Render) so the
      # studio preview shows unpublished edits. Without it the preview would
      # point at the edge and show only the last published snapshot.
      - key: XVIBE_PREVIEW_BASE_DOMAIN
        sync: false
      # Edge serving (docs/CLOUDFLARE.md). With these set, publishing mirrors
      # each app's delivery token into the Worker's KV namespace, which is
      # where the edge reads it to inject at /api/v1. Unset = the studio keeps
      # serving apps and injecting tokens itself, which is the safe default.
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CF_KV_NAMESPACE_ID
        sync: false
